name: Ch5B
options:
  bundleIdPrefix: com.ada.ch5b
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: 1
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

targets:
  HandProbe:
    type: application
    platform: iOS
    sources:
      - path: HandProbe
      # Shared with CoralAR so HandProbeTests can cover Phase 5 mode-lock math.
      - path: CoralAR/Gesture/ManipulationTracker.swift
      # Shared so HandProbeTests can cover the pick-up-and-move mechanic's move-vs-adjust trigger decision.
      - path: CoralAR/Gesture/MoveController.swift
      # Shared so HandProbeTests can cover the pest pick-up-and-throw release-distance check.
      - path: CoralAR/Gesture/PestDrop.swift
      # Shared so HandProbeTests cover the shipping GestureTuning (1.98 pinch band),
      # not a stale HandProbe fork that still claimed ADR-015's 5.9.
      - path: CoralAR/Gesture/GestureTuning.swift
      # Shared so HandProbeTests can cover the Point/Carry/Wave gesture scaffolds (added in the initial gesture-track setup commit).
      - path: CoralAR/Gesture/PointStateMachine.swift
      - path: CoralAR/Gesture/CarryStateMachine.swift
      - path: CoralAR/Gesture/WaveDetector.swift
      # Shared so HandProbe's own JointSample/PinchStateMachine/HandShapeClassifier/
      # PinchRatioCalculator forks don't drift from the shipping CoralAR versions —
      # HandProbe's local copies of these were deleted in favor of these. Also shared
      # since HandShapeClassifier/PinchRatioCalculator key on LandmarkFrame.JointSample,
      # so HandProbe uses the same joint type instead of its own parallel struct.
      - path: CoralAR/Vision/LandmarkFrame.swift
      - path: CoralAR/Gesture/PinchStateMachine.swift
      - path: CoralAR/Gesture/HandShapeClassifier.swift
      - path: CoralAR/Gesture/PinchRatioCalculator.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ada.ch5b.HandProbe
        PRODUCT_NAME: HandProbe
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HandProbe
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: Camera is used to detect hand landmarks for the Phase 0–2 probe measurements.
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        ENABLE_TESTABILITY: YES
    scheme:
      testTargets:
        - HandProbeTests

  HandProbeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HandProbeTests
    dependencies:
      - target: HandProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ada.ch5b.HandProbeTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: 1

  # The shipping app: room layer and AR layer in one target, one @main (CoralARApp.swift).
  # The layering rule still holds where it matters — Networking/ imports no ARKit/RealityKit —
  # it is now enforced by folder discipline and grep rather than by a target boundary.
  CoralAR:
    type: application
    platform: iOS
    sources:
      - path: CoralARApp.swift
      - path: Networking
      - path: Model
      - path: Views
      - path: CoralAR
        excludes:
          - "Resources/coral.usdz"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ada.ch5b.CoralAR
        PRODUCT_NAME: CoralAR
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: P23A73L3J8
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
    # Hand-written plist rather than GENERATE_INFOPLIST_FILE. Verified against Xcode 26.6:
    # there is no INFOPLIST_KEY_NSBonjourServices — array-valued Info.plist keys have no
    # build-setting equivalent — so a real file is the only way to declare the services.
    # Without them, and without the usage description, Bonjour finds nothing and reports no
    # error. Generated from the properties below; edit them, not the plist.
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: CoralAR
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Landscape-only, unchanged from the AR-only build. The room screens are stock Forms
        # and render fine sideways; letting the app rotate would change AR's orientation
        # assumptions, which is not this change's business.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Camera is used for AR world tracking and hand-gesture placement of the coral model.
        NSLocalNetworkUsageDescription: Nearby players are discovered over the local network to join a coral room.
        NSBonjourServices:
          - _coral-rooms._tcp
          - _coral-rooms._udp
    scheme:
      testTargets: []
